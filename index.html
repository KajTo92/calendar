<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalendarz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <section class="brand" aria-label="Kalendarz">
          <div class="pair-icons" aria-hidden="true">
            <span class="icon-badge"><img src="mis.png" alt="" /></span>
            <span class="icon-badge"><img src="myszka.png" alt="" /></span>
          </div>
          <div>
            <p class="eyebrow">dla Was dwojga</p>
            <h1>Kalendarz</h1>
          </div>
        </section>
        <section class="month-controls" aria-label="Nawigacja miesiąca">
          <button class="icon-button" id="prevMonth" aria-label="Poprzedni miesiąc">‹</button>
          <div class="month-title" aria-live="polite"><span id="monthName"></span><strong id="yearName"></strong></div>
          <button class="icon-button" id="nextMonth" aria-label="Następny miesiąc">›</button>
          <button class="icon-button" id="themeToggle" aria-label="Przełącz tryb dzień noc">☾</button>
        </section>
      </header>

      <details class="summary-panel" id="summaryPanel" open>
        <summary class="summary-toggle"><span>Podsumowanie</span><strong><span id="summaryToggleCount">0</span> wspólnych wolnych</strong><span>⌄</span></summary>
        <section class="summary-strip" aria-label="Podsumowanie miesiąca">
          <article class="summary-card together-card"><span class="summary-value" id="togetherFreeCount">0</span><span class="summary-label">wspólnych wolnych dni</span></article>
          <article class="summary-card"><span class="summary-dot his-dot"></span><span>Janek praca</span></article>
          <article class="summary-card"><span class="summary-dot her-day-dot"></span><span>Monika</span></article>
          <article class="summary-card"><span class="summary-dot her-day-dot"></span><span>Monika <span class="summary-moon">☾</span></span></article>
        </section>
      </details>

      <section class="calendar-wrap" aria-label="Kalendarz miesięczny">
        <div class="weekday-row" aria-hidden="true"><span>Pon</span><span>Wt</span><span>Śr</span><span>Czw</span><span>Pt</span><span>Sob</span><span>Nd</span></div>
        <div class="calendar-grid" id="calendarGrid"></div>
      </section>

      <section class="action-panel" id="actionPanel" hidden aria-live="polite">
        <div><p class="action-kicker" id="actionDate">2026</p><h2 id="actionTitle">Wydarzenie</h2></div>
        <div class="action-buttons two" id="eventActions" hidden><button class="action-button danger-button" id="deleteEventButton">Usuń</button><button class="action-button" id="moveEventButton">Przenieś</button></div>
        <div class="action-buttons" id="addActions" hidden><button class="action-button" data-add-event="janek-work">Janek</button><button class="action-button" data-add-event="monika-day">Monika</button><button class="action-button" data-add-event="monika-night">Monika ☾</button></div>
        <button class="panel-close" id="closeActionPanel" aria-label="Zamknij">×</button>
      </section>
      <div class="move-banner" id="moveBanner" hidden><span>Wybierz dzień docelowy</span><button id="cancelMoveButton">Anuluj</button></div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
  </body>
</html>
